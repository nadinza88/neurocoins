<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг клуба - Нейрокоины</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Nozhik';
            src: local('Nozhik'), local('Arial');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nozhik', 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #025FEB 0%, #00C3FA 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 30px 80px rgba(2, 95, 235, 0.3);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.8em;
            background: linear-gradient(135deg, #025FEB, #00C3FA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        .logo p {
            color: #666;
            font-size: 1.1em;
            margin-top: 5px;
        }

        .main-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .menu-card {
            background: #f8faff;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            text-decoration: none;
            color: #333;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(2, 95, 235, 0.15);
            border-color: #025FEB;
        }

        .menu-card .icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .menu-card h3 {
            font-size: 1.3em;
            margin-bottom: 8px;
            color: #025FEB;
        }

        .menu-card p {
            color: #666;
            font-size: 0.95em;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #025FEB, #00C3FA);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-family: 'Nozhik', 'Montserrat', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            width: 100%;
            text-align: center;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(2, 95, 235, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #025FEB;
            border: 2px solid #025FEB;
        }

        .btn-secondary:hover {
            background: #f8faff;
        }

        .admin-panel {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eef2ff;
        }

        .admin-panel .btn {
            background: #ff6b6b;
        }

        .admin-panel .btn:hover {
            background: #ee5a24;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            .logo h1 {
                font-size: 2em;
            }
            
            .main-menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🧠 Нейрокоины</h1>
            <p>Рейтинг учеников клуба</p>
        </div>

        <div class="main-menu">
            <a href="group.html" class="menu-card">
                <div class="icon">👀</div>
                <h3>Посмотреть рейтинг</h3>
                <p>Выберите группу и посмотрите прогресс учеников</p>
            </a>
            
            <a href="admin.html" class="menu-card">
                <div class="icon">👩‍🏫</div>
                <h3>Панель педагога</h3>
                <p>Управление учениками и начисление нейрокоинов</p>
            </a>
        </div>

        <div class="footer">
            <p>© 2024 Клуб нейрокоинов</p>
        </div>
    </div>
</body>
</html>
