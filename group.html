<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг клуба - Нейрокоины</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #025FEB 0%, #00C3FA 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 30px 80px rgba(2, 95, 235, 0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 2em;
            background: linear-gradient(135deg, #025FEB, #00C3FA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 25px;
            background: #f8faff;
            color: #025FEB;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #eef2ff;
            transform: scale(1.05);
        }

        .group-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            justify-content: center;
        }

        .group-btn {
            padding: 12px 25px;
            border: 2px solid #dfe6e9;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 1em;
            font-family: inherit;
        }

        .group-btn.active {
            background: linear-gradient(135deg, #025FEB, #00C3FA);
            color: white;
            border-color: #025FEB;
        }

        .group-btn:hover {
            border-color: #025FEB;
            transform: translateY(-2px);
        }

        .rating-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .rating-table th {
            background: linear-gradient(135deg, #025FEB, #00C3FA);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .rating-table th:first-child {
            border-radius: 15px 0 0 0;
        }

        .rating-table th:last-child {
            border-radius: 0 15px 0 0;
        }

        .rating-table td {
            padding: 15px;
            border-bottom: 2px solid #f8faff;
        }

        .rating-table tr:hover {
            background: #f8faff;
        }

        .rating-table .rank {
            font-weight: 700;
            color: #025FEB;
            font-size: 1.2em;
            text-align: center;
        }

        .rating-table .student-name {
            font-weight: 600;
            color: #2d3436;
        }

        .rating-table .coins {
            font-weight: 700;
            color: #00b894;
            font-size: 1.1em;
            text-align: right;
        }

        .rating-table .group-tag {
            display: inline-block;
            padding: 3px 12px;
            background: #eef2ff;
            color: #025FEB;
            border-radius: 50px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .top-student {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .top-student .crown {
            margin-bottom: 10px;
        }

        .top-student .crown img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .top-student .name {
            font-size: 1.8em;
            font-weight: 700;
            color: #2d3436;
        }

        .top-student .coins {
            font-size: 1.3em;
            color: #2d3436;
        }

        .top-student .group {
            font-size: 1em;
            color: #555;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .rating-table {
                font-size: 0.9em;
            }

            .rating-table th,
            .rating-table td {
                padding: 10px;
            }

            .group-btn {
                padding: 10px 15px;
                font-size: 0.9em;
            }

            .top-student .name {
                font-size: 1.3em;
            }

            .top-student .crown img {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 Рейтинг клуба</h1>
            <a href="index.html" class="back-btn">← На главную</a>
        </div>

        <div class="group-selector" id="groupSelector">
            <button class="group-btn active" onclick="selectGroup('all')">Все группы</button>
        </div>

        <div id="topStudent"></div>
        <div id="ratingContent">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const MY_SUPABASE_URL = 'https://hbbpkfqlgwruklzanmwv.supabase.co';
        const MY_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhiYnBrZnFsZ3dydWtsemFubXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDYxODYsImV4cCI6MjEwNDEyMjE4Nn0.1B8WzdGP6tAdWJxp0pYEgxBsmLXIeEXBgJ7BLWfm-ag';

        const supabaseClient = supabase.createClient(MY_SUPABASE_URL, MY_SUPABASE_KEY);
        let students = [];
        let currentGroup = 'all';

        async function loadData() {
            try {
                const { data, error } = await supabaseClient
                    .from('students')
                    .select('*')
                    .order('coins', { ascending: false });

                if (error) throw error;
                students = data || [];
                renderGroupSelector();
                renderRating();
            } catch (error) {
                document.getElementById('ratingContent').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <h3>Ошибка загрузки</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function selectGroup(group) {
            currentGroup = group;
            document.querySelectorAll('.group-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.group === group) btn.classList.add('active');
            });
            renderRating();
        }

        function renderGroupSelector() {
            const container = document.getElementById('groupSelector');
            const groups = [...new Set(students.map(s => s.group_name))];
            
            let html = `<button class="group-btn active" data-group="all" onclick="selectGroup('all')">Все группы</button>`;
            groups.forEach(groupName => {
                html += `<button class="group-btn" data-group="${groupName}" onclick="selectGroup('${groupName}')">${groupName}</button>`;
            });
            container.innerHTML = html;
        }

        function renderRating() {
            const container = document.getElementById('ratingContent');
            const topContainer = document.getElementById('topStudent');

            let filtered = currentGroup === 'all' ? students : students.filter(s => s.group_name === currentGroup);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="icon">📚</div><h3>Нет учеников</h3></div>`;
                topContainer.innerHTML = '';
                return;
            }

            const top = filtered[0];
            topContainer.innerHTML = `
                <div class="top-student">
                    <div class="crown">
                        <img src="https://i.postimg.cc/prP9Rczb/Chat-GPT-Image-31-iul-2025-g-15-52-38.png" alt="Логотип клуба">
                    </div>
                    <div class="name">${top.name}</div>
                    <div class="coins">🪙 ${top.coins} нейрокоинов</div>
                    <div class="group">Группа: ${top.group_name}</div>
                </div>
            `;

            let html = `
                <table class="rating-table">
                    <thead>
                        <tr>
                            <th style="width:60px;">Место</th>
                            <th>Ученик</th>
                            <th>Группа</th>
                            <th style="text-align:right;">Нейрокоины</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filtered.forEach((s, index) => {
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}`;
                html += `
                    <tr>
                        <td class="rank">${medal}</td>
                        <td class="student-name">${s.name}</td>
                        <td><span class="group-tag">${s.group_name}</span></td>
                        <td class="coins">🪙 ${s.coins}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        setInterval(loadData, 30000);
        loadData();
    </script>
</body>
</html>
