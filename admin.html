<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель педагога - Нейрокоины</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #025FEB 0%, #00C3FA 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 30px 80px rgba(2, 95, 235, 0.2);
        }
        h1 {
            color: #025FEB;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 16px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-primary {
            background: #025FEB;
            color: white;
        }
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        .btn-success {
            background: #00b894;
            color: white;
        }
        .btn-secondary {
            background: #dfe6e9;
            color: #2d3436;
        }
        .error-message {
            background: #ffe0e0;
            color: #d63031;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .student-list {
            margin-top: 20px;
        }
        .student-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #dfe6e9;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .student-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .student-actions .btn {
            padding: 5px 10px;
            font-size: 12px;
        }
        .login-form {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 30px;
        }
        .login-form h2 {
            text-align: center;
            color: #025FEB;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Форма входа -->
    <div id="loginForm">
        <div class="login-form">
            <h2>👩‍🏫 Вход для педагога</h2>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="passwordInput" placeholder="Введите пароль" onkeypress="if(event.key==='Enter') login()">
            </div>
            <button class="btn btn-primary" onclick="login()" style="width:100%;">Войти</button>
            <p style="text-align:center;margin-top:15px;color:#999;">Пароль: 123456</p>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="mainContent" style="display:none;">
        <div class="container">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
                <h1>👩‍🏫 Панель педагога</h1>
                <button class="btn btn-secondary" onclick="logout()">🚪 Выйти</button>
            </div>

            <div id="statusMessage"></div>

            <div style="background:#f8faff;padding:20px;border-radius:15px;margin-bottom:20px;">
                <h3>📊 Статистика</h3>
                <div class="stats-grid">
                    <div><strong>👨‍🎓 Учеников:</strong> <span id="totalStudents">0</span></div>
                    <div><strong>🪙 Всего монет:</strong> <span id="totalCoins">0</span></div>
                    <div><strong>📚 Групп:</strong> <span id="totalGroups">0</span></div>
                </div>
            </div>

            <div style="background:#f8faff;padding:20px;border-radius:15px;margin-bottom:20px;">
                <h3>➕ Добавить ученика</h3>
                <form id="studentForm" onsubmit="addStudent(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Имя ученика *</label>
                            <input type="text" id="studentName" required placeholder="Иван Петров">
                        </div>
                        <div class="form-group">
                            <label>Группа *</label>
                            <input type="text" id="studentGroup" required placeholder="Группа А">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Начальные монеты</label>
                            <input type="number" id="studentCoins" value="0" min="0">
                        </div>
                        <div class="form-group">
                            <label>Комментарий</label>
                            <input type="text" id="studentComment" placeholder="За что начислены">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;">➕ Добавить ученика</button>
                </form>
            </div>

            <div style="background:#f8faff;padding:20px;border-radius:15px;">
                <h3>👨‍🎓 Список учеников</h3>
                <div id="studentsList">
                    <p>Загрузка...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================
        // 🔑 ВСТАВЬТЕ СВОИ КЛЮЧИ ЗДЕСЬ:
        // ============================================
        const MY_SUPABASE_URL = 'https://hbbpkfqlgwruklzanmwv.supabase.co/';
        const MY_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhiYnBrZnFsZ3dydWtsemFubXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NDYxODYsImV4cCI6MjEwNDEyMjE4Nn0.1B8WzdGP6tAdWJxp0pYEgxBsmLXIeEXBgJ7BLWfm-ag';
        // ============================================

        const ADMIN_PASSWORD = '123456';
        let students = [];
        let groups = [];

        // СОЗДАЕМ КЛИЕНТ ТОЛЬКО ОДИН РАЗ
        const sb = supabase.createClient(MY_SUPABASE_URL, MY_SUPABASE_KEY);

        console.log('✅ Supabase инициализирован');

        // Проверяем ключи
        if (MY_SUPABASE_URL === 'https://ВАШ_ПРОЕКТ.supabase.co' || MY_SUPABASE_KEY === 'ВАШ_ПУБЛИЧНЫЙ_КЛЮЧ') {
            document.getElementById('loginForm').innerHTML = `
                <div class="login-form">
                    <h2>⚠️ Ошибка настройки</h2>
                    <div class="error-message">
                        <p><strong>Не вставлены ключи Supabase!</strong></p>
                        <p>Откройте файл admin.html и найдите строки:</p>
                        <code style="display:block;background:#f4f4f4;padding:10px;border-radius:5px;margin:10px 0;white-space:pre-wrap;">
const MY_SUPABASE_URL = 'https://ВАШ_ПРОЕКТ.supabase.co';
const MY_SUPABASE_KEY = 'ВАШ_ПУБЛИЧНЫЙ_КЛЮЧ';
                        </code>
                        <p>Замените на свои данные из настроек Supabase.</p>
                    </div>
                </div>
            `;
        } else {
            checkConnection();
        }

        async function checkConnection() {
            try {
                const { data, error } = await sb.from('students').select('count');
                if (error) {
                    showError('Ошибка подключения: ' + error.message);
                    return;
                }
                showSuccess('✅ Подключение к Supabase успешно!');
                checkAuth();
            } catch (e) {
                showError('❌ Ошибка: ' + e.message);
            }
        }

        function showError(msg) {
            const el = document.getElementById('statusMessage');
            el.innerHTML = `<div class="error-message">❌ ${msg}</div>`;
        }

        function showSuccess(msg) {
            const el = document.getElementById('statusMessage');
            el.innerHTML = `<div class="success-message">✅ ${msg}</div>`;
        }

        function checkAuth() {
            const saved = localStorage.getItem('teacherAuth');
            if (saved === 'true') {
                showMainContent();
            } else {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('mainContent').style.display = 'none';
            }
        }

        function login() {
            const password = document.getElementById('passwordInput').value;
            if (password === ADMIN_PASSWORD) {
                localStorage.setItem('teacherAuth', 'true');
                showMainContent();
            } else {
                alert('❌ Неверный пароль!');
            }
        }

        function logout() {
            localStorage.removeItem('teacherAuth');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        }

        async function showMainContent() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            await loadData();
        }

        async function loadData() {
            try {
                const [studentsRes, groupsRes] = await Promise.all([
                    sb.from('students').select('*').order('coins', { ascending: false }),
                    sb.from('groups').select('*').order('name')
                ]);

                if (studentsRes.error) throw studentsRes.error;
                if (groupsRes.error) throw groupsRes.error;

                students = studentsRes.data || [];
                groups = groupsRes.data || [];

                renderStats();
                renderStudents();
                showSuccess('✅ Данные загружены');

            } catch (error) {
                showError('Ошибка загрузки: ' + error.message);
            }
        }

        async function addStudent(event) {
            event.preventDefault();
            const name = document.getElementById('studentName').value.trim();
            const group = document.getElementById('studentGroup').value.trim();
            const coins = parseInt(document.getElementById('studentCoins').value) || 0;
            const comment = document.getElementById('studentComment').value.trim() || 'Первое начисление';

            if (!name || !group) {
                alert('❌ Заполните имя и группу!');
                return;
            }

            try {
                const newStudent = {
                    name: name,
                    group_name: group,
                    coins: coins,
                    history: [{ amount: coins, comment: comment, date: new Date().toLocaleDateString('ru-RU') }]
                };

                const { data, error } = await sb
                    .from('students')
                    .insert([newStudent])
                    .select()
                    .single();

                if (error) throw error;

                students.push(data);
                document.getElementById('studentForm').reset();
                document.getElementById('studentCoins').value = 0;

                renderStats();
                renderStudents();
                showSuccess('✅ Ученик добавлен!');

            } catch (error) {
                showError('Ошибка добавления: ' + error.message);
                alert('❌ Ошибка добавления ученика');
            }
        }

        async function addCoins(studentId) {
            const amount = prompt('Сколько нейрокоинов начислить?');
            if (amount === null) return;
            const numAmount = parseInt(amount);
            if (isNaN(numAmount) || numAmount <= 0) {
                alert('❌ Введите положительное число!');
                return;
            }

            const comment = prompt('За что начисляем?') || 'Начисление';
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            try {
                const newCoins = student.coins + numAmount;
                const history = student.history || [];
                history.push({ amount: numAmount, comment: comment, date: new Date().toLocaleDateString('ru-RU') });

                const { error } = await sb
                    .from('students')
                    .update({ coins: newCoins, history: history })
                    .eq('id', studentId);

                if (error) throw error;

                student.coins = newCoins;
                student.history = history;
                renderStats();
                renderStudents();
                alert(`✅ Начислено ${numAmount} нейрокоинов`);

            } catch (error) {
                showError('Ошибка начисления: ' + error.message);
            }
        }

        async function subtractCoins(studentId) {
            const amount = prompt('Сколько нейрокоинов списать?');
            if (amount === null) return;
            const numAmount = parseInt(amount);
            if (isNaN(numAmount) || numAmount <= 0) {
                alert('❌ Введите положительное число!');
                return;
            }

            const student = students.find(s => s.id === studentId);
            if (!student) return;

            if (student.coins < numAmount) {
                alert('❌ Недостаточно нейрокоинов!');
                return;
            }

            const comment = prompt('Причина списания?') || 'Списание';

            try {
                const newCoins = student.coins - numAmount;
                const history = student.history || [];
                history.push({ amount: -numAmount, comment: comment, date: new Date().toLocaleDateString('ru-RU') });

                const { error } = await sb
                    .from('students')
                    .update({ coins: newCoins, history: history })
                    .eq('id', studentId);

                if (error) throw error;

                student.coins = newCoins;
                student.history = history;
                renderStats();
                renderStudents();
                alert(`✅ Списано ${numAmount} нейрокоинов`);

            } catch (error) {
                showError('Ошибка списания: ' + error.message);
            }
        }

        async function deleteStudent(studentId) {
            if (!confirm('Вы уверены, что хотите удалить ученика?')) return;

            const student = students.find(s => s.id === studentId);
            try {
                const { error } = await sb
                    .from('students')
                    .delete()
                    .eq('id', studentId);

                if (error) throw error;

                students = students.filter(s => s.id !== studentId);
                renderStats();
                renderStudents();
                alert(`❌ Ученик удален`);

            } catch (error) {
                showError('Ошибка удаления: ' + error.message);
            }
        }

        function renderStats() {
            document.getElementById('totalStudents').textContent = students.length;
            document.getElementById('totalCoins').textContent = students.reduce((sum, s) => sum + s.coins, 0);
            document.getElementById('totalGroups').textContent = new Set(students.map(s => s.group_name)).size;
        }

        function renderStudents() {
            const container = document.getElementById('studentsList');

            if (students.length === 0) {
                container.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">Нет учеников</p>';
                return;
            }

            const sorted = [...students].sort((a, b) => b.coins - a.coins);
            let html = '<div class="student-list">';
            sorted.forEach((s, index) => {
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}`;
                html += `
                    <div class="student-item">
                        <div>
                            <span style="font-weight:700;color:#025FEB;">${medal}</span>
                            <strong>${s.name}</strong>
                            <span style="color:#999;font-size:0.9em;margin:0 10px;">${s.group_name}</span>
                            <span style="color:#00b894;font-weight:700;">🪙 ${s.coins}</span>
                        </div>
                        <div class="student-actions">
                            <button class="btn btn-success" onclick="addCoins(${s.id})">➕</button>
                            <button class="btn btn-danger" onclick="subtractCoins(${s.id})">➖</button>
                            <button class="btn btn-secondary" onclick="showHistory(${s.id})">📜</button>
                            <button class="btn btn-danger" onclick="deleteStudent(${s.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function showHistory(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            let msg = `📊 История ${student.name}\n`;
            msg += `Всего монет: ${student.coins}\n`;
            msg += '━'.repeat(30) + '\n';

            if (student.history && student.history.length > 0) {
                const sorted = [...student.history].reverse();
                sorted.forEach(item => {
                    const sign = item.amount > 0 ? '+' : '';
                    msg += `${item.date} ${sign}${item.amount} - ${item.comment}\n`;
                });
            } else {
                msg += 'История пуста';
            }

            alert(msg);
        }

        console.log('✅ Admin panel loaded successfully!');
    </script>
</body>
</html>
